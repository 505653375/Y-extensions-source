name: Build Roumanwu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zh-roumanwu
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: ./gradlew :src:zh:roumanwu:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roumanwu-test
          path: src/zh/roumanwu/build/outputs/apk/release/*.apk
